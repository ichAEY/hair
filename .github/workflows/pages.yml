name: Quality and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /hair
    steps:
      - name: Checkout client repository with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recover verified client data from source history
        run: git show 3b28809bf0be505873a78dab8ba9eec29a74d961:site-data.mjs > legacy-site-data.mjs

      - name: Checkout current TANEM master template
        uses: actions/checkout@v5
        with:
          repository: ichAEY/Shablon-For-Only-Masters
          ref: main
          path: template

      - name: Preserve existing client photos
        run: |
          mkdir -p template/public/assets/client
          cp -a assets/. template/public/assets/client/

      - name: Convert Elena data to current Hair preset
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const old=(await import(pathToFileURL(process.cwd()+'/legacy-site-data.mjs'))).default;
          const base=process.env.NEXT_PUBLIC_BASE_PATH||"";
          const fix=(p)=>p ? `${base}/${p.replace(/^\//,'')}` : "";
          const groups=(old.serviceCategories||[]).map(g=>({id:g.key,label:g.label,services:g.items}));
          const data={
            basePath:base,
            template:{specialty:"hair",bookingProvider:"",reviewSource:"Яндекс Карты"},
            brand:old.brand,
            master:{
              ...old.master,
              name:"Елена",
              instrumental:"Еленой",
              heroTitle:"",
              heroEmphasis:"эксперт по волосам",
              heroCaption:"Парикмахер-колорист",
              imageAlt:"Елена Строганова, парикмахер-колорист",
              heroCopy:"Стрижки, окрашивание, блонд, уход и укладки с вниманием к состоянию волос, оттенку и вашему образу.",
              visitMotto:"",
              experienceYears:null,
              aboutTitle:"Елена Строганова",
              aboutLead:"",
              aboutParagraphs:[],
              skills:[]
            },
            location:{...old.location,country:"Россия",countryCode:"RU",timeZone:"Europe/Moscow",openTime:"10:00",closeTime:"21:00"},
            contacts:{phoneDisplay:old.contacts.phoneDisplay,phoneHref:old.contacts.phoneHref,channels:[{type:"whatsapp",label:"WhatsApp",url:"https://wa.me/79687121165"}],messenger:null},
            links:{bookingUrl:old.links.bookingUrl,reviewsUrl:old.links.reviewsUrl,mapUrl:old.links.mapUrl,routeUrl:old.links.routeUrl,mobileMapEmbedUrl:"about:blank",desktopMapEmbedUrl:"about:blank",yandexMapHrefMatch:"152363495769"},
            reputation:old.reputation,
            images:{
              logo:"",portrait:fix(old.images.heroDesktop||old.images.portrait),portraitDesktop:fix(old.images.heroDesktop||old.images.portrait),
              about:fix(old.images.about),favicon:`${base}/favicon-source.png`,heroDecoration:`${base}/assets/template/hair-tools.png`,
              beforeAfter:[],gallery:(old.images.gallery||[]).map(x=>({...x,src:fix(x.src)}))
            },
            services:{groups},
            i18n:{localLocale:"ru",locales:[{code:"ru",label:"RU"},{code:"en",label:"EN"}],translations:{en:{}}},
            reviews:(old.reviews||[]).map(r=>({...r,source:"Яндекс Карты"})),
            promotions:[],amenities:[],
            seo:{siteUrl:"https://ichaey.github.io/hair/",...old.seo},
            analytics:old.analytics||{yandexMetrikaId:""}
          };
          fs.writeFileSync('template/site-data.mjs','export default '+JSON.stringify(data,null,2)+';\n');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json

      - name: Build current template
        working-directory: template
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: template/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
